<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radcore | Empire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
	/* ====== НАСТРОЙКИ ВНЕШНЕГО ВИДА ====== */
	:root {
		--accent: #c82828;      /* основной цвет (красный Империи) */
		--text: #e1e4eb;
		--muted: #8c929e;
		--bg: #07080b;
		--panel: rgba(16, 19, 25, 0.82);
		--line: rgba(255, 255, 255, 0.09);
	}

	* { box-sizing: border-box; margin: 0; padding: 0; }

	html, body {
		width: 100%;
		height: 100%;
		overflow: hidden;
		background: var(--bg);
		color: var(--text);
		font-family: "Exo 2", Tahoma, sans-serif;
	}

	#stars { position: fixed; inset: 0; }

	/* Затемнение к низу и красное свечение у горизонта */
	.vignette {
		position: fixed;
		inset: 0;
		background:
			radial-gradient(ellipse at 50% 120%, rgba(200, 40, 40, 0.22), transparent 55%),
			radial-gradient(ellipse at 50% 40%, transparent 30%, rgba(0, 0, 0, 0.75) 100%);
		pointer-events: none;
	}

	.wrap {
		position: relative;
		height: 100%;
		display: flex;
		flex-direction: column;
		justify-content: space-between;
		padding: 6vh 7vw;
	}

	/* Шапка */
	.head { display: flex; align-items: center; gap: 22px; }

	.emblem {
		width: 64px;
		height: 64px;
		flex: none;
	}

	.title {
		font-size: 44px;
		font-weight: 700;
		letter-spacing: 6px;
		text-transform: uppercase;
		line-height: 1;
	}

	.title span { color: var(--accent); }

	.subtitle {
		margin-top: 8px;
		font-size: 16px;
		font-weight: 500;
		letter-spacing: 4px;
		color: var(--muted);
		text-transform: uppercase;
	}

	/* Центр: совет */
	.tip {
		align-self: center;
		max-width: 720px;
		text-align: center;
		padding: 22px 28px;
		background: var(--panel);
		border: 1px solid var(--line);
		position: relative;
		transition: opacity 0.6s;
	}

	.tip::before, .tip::after {
		content: "";
		position: absolute;
		width: 14px;
		height: 14px;
		border: 2px solid var(--accent);
	}
	.tip::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
	.tip::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

	.tip-label {
		font-size: 12px;
		font-weight: 600;
		letter-spacing: 3px;
		color: var(--accent);
		margin-bottom: 8px;
	}

	.tip-text { font-size: 19px; line-height: 1.45; }

	/* Низ: статус и прогресс */
	.bottom { display: flex; flex-direction: column; gap: 12px; }

	.row {
		display: flex;
		justify-content: space-between;
		align-items: flex-end;
		gap: 20px;
		font-size: 15px;
	}

	.status { font-size: 18px; font-weight: 600; }
	.file { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
	.info { color: var(--muted); text-align: right; white-space: nowrap; }

	.bar {
		height: 6px;
		background: rgba(255, 255, 255, 0.07);
		border: 1px solid var(--line);
		overflow: hidden;
	}

	.bar-fill {
		height: 100%;
		width: 0%;
		background: linear-gradient(90deg, #7a1414, var(--accent));
		box-shadow: 0 0 12px var(--accent);
		transition: width 0.4s ease;
	}

	/* Пока сервер не сообщил число файлов — бегущая полоса */
	.bar.indeterminate .bar-fill {
		width: 30%;
		animation: slide 1.6s ease-in-out infinite;
	}

	@keyframes slide {
		0% { transform: translateX(-110%); }
		100% { transform: translateX(360%); }
	}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="vignette"></div>

<div class="wrap">
	<div class="head">
		<!-- Эмблема: простой шестиугольник со звездой (своя, не логотип) -->
		<svg class="emblem" viewBox="0 0 64 64" aria-hidden="true">
			<polygon points="32,3 57,17.5 57,46.5 32,61 7,46.5 7,17.5" fill="none" stroke="#c82828" stroke-width="3"/>
			<polygon points="32,14 47,23 47,41 32,50 17,41 17,23" fill="none" stroke="#e1e4eb" stroke-width="1.5" opacity="0.6"/>
			<circle cx="32" cy="32" r="6" fill="#c82828"/>
			<line x1="32" y1="3" x2="32" y2="14" stroke="#c82828" stroke-width="2"/>
			<line x1="32" y1="50" x2="32" y2="61" stroke="#c82828" stroke-width="2"/>
			<line x1="7" y1="17.5" x2="17" y2="23" stroke="#c82828" stroke-width="2"/>
			<line x1="57" y1="17.5" x2="47" y2="23" stroke="#c82828" stroke-width="2"/>
			<line x1="7" y1="46.5" x2="17" y2="41" stroke="#c82828" stroke-width="2"/>
			<line x1="57" y1="46.5" x2="47" y2="41" stroke="#c82828" stroke-width="2"/>
		</svg>
		<div>
			<div class="title" id="title">Radcore <span>|</span> Empire</div>
			<div class="subtitle" id="subtitle">Star Wars Roleplay</div>
		</div>
	</div>

	<div class="tip" id="tip">
		<div class="tip-label">ИНФОРМАЦИЯ</div>
		<div class="tip-text" id="tipText">Подключение к серверу...</div>
	</div>

	<div class="bottom">
		<div class="row">
			<div>
				<div class="status" id="status">Подключение...</div>
				<div class="file" id="file">&nbsp;</div>
			</div>
			<div class="info" id="info">&nbsp;</div>
		</div>
		<div class="bar indeterminate" id="bar"><div class="bar-fill" id="fill"></div></div>
	</div>
</div>

<script>
	/* ====== НАСТРОЙКИ ====== */
	var CONFIG = {
		// Название и подпись. useServerName: true — брать название из настроек сервера (hostname)
		title: "Radcore <span>|</span> Empire",
		subtitle: "Star Wars Roleplay",
		useServerName: false,

		// Советы на экране загрузки (меняются каждые tipInterval секунд)
		tipInterval: 7,
		tips: [
			"F1 — справка по серверу, F4 — инвентарь, TAB — список игроков.",
			"Ваш персонаж не знает имён незнакомцев. Представьтесь: /intro или /introall.",
			"Смертельное ранение не убивает сразу — дождитесь медика.",
			"Специальность даёт баффы. Чужую броню и оружие носить можно, но со штрафами.",
			"Приказ вашего подразделения — в левом верхнем углу экрана.",
			"Рация подразделения — /r, рация фракции — /rf.",
			"Чат вне роли — //. Вопрос администрации — @текст.",
			"Империя может арестовать и посадить в камеру. Срок идёт, пока вы на сервере.",
			"В !div — казна подразделения и ваше личное дело."
		]
	};

	/* ====== Звёзды ====== */
	var canvas = document.getElementById("stars");
	var ctx = canvas.getContext("2d");
	var stars = [];

	function resize() {
		canvas.width = window.innerWidth;
		canvas.height = window.innerHeight;
		stars = [];
		var count = Math.floor(canvas.width * canvas.height / 3500);
		for (var i = 0; i < count; i++) {
			stars.push({
				x: Math.random() * canvas.width,
				y: Math.random() * canvas.height,
				r: Math.random() * 1.3 + 0.2,
				s: Math.random() * 0.25 + 0.03,
				a: Math.random() * 0.6 + 0.3,
				t: Math.random() * Math.PI * 2
			});
		}
	}

	function draw() {
		ctx.clearRect(0, 0, canvas.width, canvas.height);
		for (var i = 0; i < stars.length; i++) {
			var st = stars[i];
			st.x -= st.s;
			st.t += 0.02;
			if (st.x < 0) { st.x = canvas.width; st.y = Math.random() * canvas.height; }
			ctx.globalAlpha = st.a * (0.75 + 0.25 * Math.sin(st.t));
			ctx.fillStyle = "#ffffff";
			ctx.beginPath();
			ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
			ctx.fill();
		}
		ctx.globalAlpha = 1;
		requestAnimationFrame(draw);
	}

	window.addEventListener("resize", resize);
	resize();
	draw();

	/* ====== Советы ====== */
	document.getElementById("title").innerHTML = CONFIG.title;
	document.getElementById("subtitle").textContent = CONFIG.subtitle;

	var tipIndex = Math.floor(Math.random() * CONFIG.tips.length);
	var tipBox = document.getElementById("tip");
	var tipText = document.getElementById("tipText");

	function nextTip() {
		tipBox.style.opacity = 0;
		setTimeout(function () {
			tipIndex = (tipIndex + 1) % CONFIG.tips.length;
			tipText.textContent = CONFIG.tips[tipIndex];
			tipBox.style.opacity = 1;
		}, 600);
	}

	tipText.textContent = CONFIG.tips[tipIndex];
	setInterval(nextTip, CONFIG.tipInterval * 1000);

	/* ====== Функции, которые вызывает Garry's Mod ====== */
	var filesTotal = 0;
	var filesNeeded = 0;

	function setProgress() {
		var bar = document.getElementById("bar");
		var fill = document.getElementById("fill");
		if (filesTotal > 0) {
			bar.classList.remove("indeterminate");
			var done = Math.max(0, filesTotal - filesNeeded);
			fill.style.width = Math.min(100, done / filesTotal * 100) + "%";
			document.getElementById("info").textContent = "Файлы: " + done + " / " + filesTotal;
		}
	}

	function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
		if (CONFIG.useServerName && servername) {
			document.getElementById("title").textContent = servername;
		}
		var info = "Карта: " + mapname;
		if (maxplayers) info += "  ·  Мест: " + maxplayers;
		document.getElementById("info").textContent = info;
	}

	function SetFilesTotal(total) {
		filesTotal = total;
		setProgress();
	}

	function SetFilesNeeded(needed) {
		filesNeeded = needed;
		setProgress();
	}

	function DownloadingFile(fileName) {
		document.getElementById("file").textContent = "Загрузка: " + fileName;
	}

	// Перевод стандартных статусов загрузки
	var STATUS = [
		[/Workshop/i, "Загрузка контента из Workshop..."],
		[/Retrieving server info/i, "Получение информации о сервере..."],
		[/Mounting/i, "Подключение контента..."],
		[/Sending client info/i, "Отправка данных..."],
		[/Lua/i, "Загрузка скриптов..."],
		[/Starting/i, "Запуск..."],
		[/Requesting|Precach/i, "Подготовка ресурсов..."],
		[/Parsing|Loading/i, "Загрузка карты..."]
	];

	function SetStatusChanged(status) {
		var text = status;
		for (var i = 0; i < STATUS.length; i++) {
			if (STATUS[i][0].test(status)) { text = STATUS[i][1]; break; }
		}
		document.getElementById("status").textContent = text;
	}
</script>
</body>
</html>
