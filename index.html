<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<title>Force Arena — загрузка</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="style.css">
	<script src="config.js"></script>
</head>
<body>
	<div id="slides"></div>
	<div class="shade"></div>
	<div class="scanlines"></div>

	<div id="stage">
	<div id="top">
		<img id="logo" src="img/logo_en.png" alt="Force Arena">
		<div id="details"><span id="server">Arena of the Force</span><span class="dot">·</span><span id="map">загрузка</span><span class="dot">·</span><span id="players">—</span></div>
	</div>

	<div id="sides"></div>

	<div id="bottom">
		<div id="tip">
			<span class="tip-label">СОВЕТ</span>
			<span id="tip-text"></span>
		</div>
		<div id="status-row">
			<span id="status">Подключение к серверу…</span>
			<span id="percent">0%</span>
		</div>
		<div id="bar"><div id="bar-fill"></div><div id="bar-glow"></div></div>
		<div id="file"></div>
	</div>

	</div>

	<script src="script.js"></script>
</body>
</html>
